kepa-js:
  filter: rjsmin
  output: ckanext-kepa/%(version)s-kepa.js
  contents:
    - js/silktide-consent-manager.js
  extra:
    preload:
      - base/main

kepa-css:
  filter: cssrewrite
  output: ckanext-kepa/%(version)s-kepa.css
