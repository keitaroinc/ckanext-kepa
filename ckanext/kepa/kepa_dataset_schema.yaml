scheming_version: 2
dataset_type: dataset
about: KEPA custom metadata scheme
about_url: https://github.com/keitaroinc/ckanext-kepa


dataset_fields:

- field_name: title_translated
  label:
    en: Title
    sq: Titulli
    sr_Latn: Naslov
  fluent_form_label:
    en:
      en: Title (English)
      sq: Titulli (Anglisht)
      sr_Latn: Naslov (Engleski)
    sq:
      en: Title (Albanian)
      sq: Titulli (Shqip)
      sr_Latn: Naslov (Albanski)
    sr_Latn:
      en: Title (Serbian)
      sq: Titulli (Serbisht)
      sr_Latn: Naslov (Srpski)
  preset: fluent_core_translated
  required: true

- field_name: name
  label: URL
  preset: dataset_slug
  form_placeholder: eg. my-dataset  

- field_name: notes_translated
  label:
    en: Description
    sq: Përshkrimi
    sr_Latn: Opis
  fluent_form_label:
    en:
      en: Description (English)
      sq: Përshkrimi (Anglisht)
      sr_Latn: Opis (Engleski)
    sq:
      en: Description (Albanian)
      sq: Përshkrimi (Shqip)
      sr_Latn: Opis (Albanski)
    sr_Latn:
      en: Description (Serbian)
      sq: Përshkrimi (Serbisht)
      sr_Latn: Opis (Srpski)
  fluent_help_text:
    en:
      en: "An account of the dataset, in English. A description may include but is not limited to: an abstract, a table of contents, or a free-text account of the resource."
      sq: "Një përshkrim i të dhënave, në anglisht. Një përshkrim mund të përfshijë, por nuk kufizohet në: një përmbledhje, një tabelë përmbajtjesh, ose një llogari me tekst të lirë të burimit."
      sr_Latn: "Opis skupa podataka, na engleskom jeziku. Opis može uključivati, ali nije ograničen na: sažetak, sadržaj"
    sq:
      en: "An account of the dataset, in French. A description may include but is not limited to: an abstract, a table of contents, or a free-text account of the resource."
      sq: "Një përshkrim i të dhënave, në shqip. Një përshkrim mund të përfshijë, por nuk kufizohet në: një përmbledhje, një tabelë përmbajtjesh, ose një llogari me tekst të lirë të burimit."
      sr_Latn: "Opis skupa podataka, na srpskom jeziku. Opis može uključivati, ali nije ograničen na: sažetak, sadržaj"
    sr_Latn:
      en: "An account of the dataset, in English. A description may include but is not limited to: an abstract, a table of contents, or a free-text account of the resource."
      sq: "Një përshkrim i të dhënave, në anglisht. Një përshkrim mund të përfshijë, por nuk kufizohet në: një përmbledhje, një tabelë përmbajtjesh, ose një logari me tekst të lirë të burimit."
      sr_Latn: "Opis skupa podataka, na engleskom jeziku. Opis može uključivati, ali nije ograničen na: sažetak, sadržaj"
  preset: fluent_core_translated

- field_name: tag_string
  label: Tags
  preset: tag_string_autocomplete
  form_placeholder: eg. water, air, agency

- field_name: license_id
  label: License
  form_snippet: license.html
  help_text: License definitions and additional information can be found at http://opendefinition.org/

- field_name: url
  label: Source
  form_placeholder: http://example.com/dataset.json
  display_property: foaf:homepage
  display_snippet: link.html

- field_name: theme
  label: 
    en: Theme
    sq: Tema
    sr_Latn: Tema
  preset: select
  choices:
  - value: http://publications.europa.eu/resource/authority/data-theme/AGRI
    label: 
      en: Agriculture, fisheries, forestry and food
      sq: Bujqësi, peshkim, pylltari dhe ushqim
      sr_Latn: Poljoprivreda, ribarstvo, šumarstvo i hrana
  - value: http://publications.europa.eu/resource/authority/data-theme/ECON
    label: 
      en: Economy and finance
      sq: Ekonomia dhe financat
      sr_Latn: Ekonomija i finansije
  - value: http://publications.europa.eu/resource/authority/data-theme/EDUC
    label: 
      en: Education, culture and sport
      sq: Arsimi, kultura dhe sporti
      sr_Latn: Obrazovanje, kultura i sport
  - value: http://publications.europa.eu/resource/authority/data-theme/ENER
    label: 
      en: Energy
      sq: Energjisë
      sr_Latn: Energija
  - value: http://publications.europa.eu/resource/authority/data-theme/ENVI
    label: 
      en: Environment
      sq: Mjedisi
      sr_Latn: Životna sredina
  - value: http://publications.europa.eu/resource/authority/data-theme/GOVE
    label: 
      en: Government and public sector
      sq: Qeveria dhe sektori publik
      sr_Latn: Vlada i javni sektor
  - value: http://publications.europa.eu/resource/authority/data-theme/HEAL
    label: 
      en: Health
      sq: Shëndeti
      sr_Latn: Zdravlje
  - value: http://publications.europa.eu/resource/authority/data-theme/INTR
    label: 
      en: International issues
      sq: Çështjet ndërkombëtare
      sr_Latn: Međunarodna pitanja
  - value: http://publications.europa.eu/resource/authority/data-theme/JUST
    label: 
      en: Justice, legal system and public safety
      sq: Drejtësia, sistemi ligjor dhe siguria publike
      sr_Latn: Pravosuđe, pravni sistem i javna bezbednost
  - value: http://publications.europa.eu/resource/authority/data-theme/SOCI
    label: 
      en: Population and society
      sq: Popullsia dhe shoqëria
      sr_Latn: Stanovništvo i društvo
  - value: http://publications.europa.eu/resource/authority/data-theme/REGI
    label: 
      en: Regions and cities
      sq: Rajonet dhe qytetet
      sr_Latn: Regioni i gradovi
  - value: http://publications.europa.eu/resource/authority/data-theme/TECH
    label: 
      en: Science and technology
      sq: Shkencë dhe Teknologji
      sr_Latn: Nauka i tehnologija
  - value: http://publications.europa.eu/resource/authority/data-theme/TRAN
    label: 
      en: Transport
      sq: Transporti
      sr_Latn: Transport


- field_name: version
  label: 
    en: Version
    sq: Versioni
    sr_Latn: Verzija
  validators: ignore_missing unicode_safe package_version_validator
  form_placeholder: '1.0'

- field_name: publisher_name
  label: 
    en: Publisher
    sq: Botues
    sr_Latn: Izdavač
  form_placeholder: Joe Bloggs

- field_name: publisher_email
  label: 
    en: Publisher email
    sq: Email i botuesit
    sr_Latn: Email izdavača
  display_snippet: email.html
  form_placeholder: joe.blogs@example.com

- field_name: contact_uri
  label: 
    en: Publisher Contact
    sq: Kontakti i botuesit
    sr_Latn: Kontakt izdavača

- field_name: owner_org
  label: Organization
  preset: dataset_organization

- field_name: contact_name
  label: Maintainer
  form_placeholder: Joe Bloggs
  display_property: dc:contributor

- field_name: contact_email
  label: Maintainer Email
  form_placeholder: joe.blogs@example.com
  display_snippet: email.html

- field_name : spatial
  label: Spatial
  form_placeholder : {\"type\": \"Point\", \"coordinates\": [8.609762390208658, 47.40381297881529]}

- field_name: spatial_resolution_in_meters
  label: 
    en: Spatial resolution in meters
    sq: Rezolucioni hapësinor në metra
    sr_Latn: Prostorna rezolucija u metrima

- field_name: frequency
  label: 
    en: Update Frequency
    sq: Frekuenca e përditësimit
    sr_Latn: Učestalost ažuriranja
  preset: select
  choices:
  - value: daily
    label: 
      en: Daily
      sq: Ditore
      sr_Latn: Dnevno
  - value: weekly
    label: 
      en: weekly
      sq: Javore
      sr_Latn: Nedeljno
  - value: monthly
    label: 
      en: Monthly
      sq: Mujore
      sr_Latn: Mesečno
  - value: yearly
    label: 
      en: Yearly
      sq: Vjetore
      sr_Latn: Godišnje
  - value: ad-hoc
    label: 
      en: Ad-hoc
      sq: Ad-hoc
      sr_Latn: Ad-hoc
  - value: never
    label: Never

- field_name: conforms_to
  label: 
    en: Conforms to
    sq: Përputhet me
    sr_Latn: U skladu sa

- field_name: documentation
  label: 
    en: Documentation
    sq: Dokumentacioni
    sr_Latn: Dokumentacija

- field_name: temporal_start
  form_placeholder : YYYY-MM-DD
  label: 
    en: Temporal Start
    sq: Fillimi i përkohshëm
    sr_Latn: Vremenski početak

- field_name: temporal_end
  form_placeholder : YYYY-MM-DD
  label: 
    en: Temporal End
    sq: Fundi i përkohshëm
    sr_Latn: Vremenski kraj

- field_name: temporal_resolution
  label: 
    en: Temporal Resolution
    sq: Rezoluta e përkohshme
    sr_Latn: Vremenska rezolucija
  

resource_fields:

- field_name: url
  label: URL
  preset: resource_url_upload

- field_name: name
  label: Name
  form_placeholder: eg. January 2011 Gold Prices

- field_name: description
  label: Description
  form_snippet: markdown.html
  form_placeholder: Some useful notes about the data

- field_name: format
  label: Format
  preset: resource_format_autocomplete
